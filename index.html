    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Great+Vibes&family=Sacramento&family=Caveat:wght@600&family=Alex+Brush&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b1320;
            color: #f3f4f6;
        }

        /* Handwritten script font utility classes */
        .font-dancing { font-family: 'Dancing Script', cursive; }
        .font-greatvibes { font-family: 'Great Vibes', cursive; }
        .font-sacramento { font-family: 'Sacramento', cursive; }
        .font-caveat { font-family: 'Caveat', cursive; }
        .font-alex { font-family: 'Alex Brush', cursive; }

        /* Custom Scrollbar for side panel */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        /* Soundwave animation styling */
        .wave-bar {
            transition: height 0.15s ease-in-out;
            border-radius: 9999px;
            background-color: rgba(255, 255, 255, 0.85);
        }

        @keyframes wavePulse {
            0%, 100% { height: 4px; }
            50% { height: 32px; }
        }

        .is-playing .wave-bar {
            animation: wavePulse 1.2s infinite ease-in-out;
        }

        /* Stagger wave animations for organic visualizer effect */
        .is-playing .wave-bar:nth-child(1)  { animation-delay: 0.10s; }
        .is-playing .wave-bar:nth-child(2)  { animation-delay: 0.35s; }
        .is-playing .wave-bar:nth-child(3)  { animation-delay: 0.15s; }
        .is-playing .wave-bar:nth-child(4)  { animation-delay: 0.60s; }
        .is-playing .wave-bar:nth-child(5)  { animation-delay: 0.25s; }
        .is-playing .wave-bar:nth-child(6)  { animation-delay: 0.80s; }
        .is-playing .wave-bar:nth-child(7)  { animation-delay: 0.40s; }
        .is-playing .wave-bar:nth-child(8)  { animation-delay: 0.95s; }
        .is-playing .wave-bar:nth-child(9)  { animation-delay: 0.20s; }
        .is-playing .wave-bar:nth-child(10) { animation-delay: 0.70s; }
        .is-playing .wave-bar:nth-child(11) { animation-delay: 0.30s; }
        .is-playing .wave-bar:nth-child(12) { animation-delay: 0.85s; }
        .is-playing .wave-bar:nth-child(13) { animation-delay: 0.45s; }
        .is-playing .wave-bar:nth-child(14) { animation-delay: 0.65s; }
        .is-playing .wave-bar:nth-child(15) { animation-delay: 0.15s; }

        /* Custom Slider styling */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.3);
            height: 3px;
            border-radius: 2px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.4);
            transition: transform 0.15s ease;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.4);
        }

        /* Glassmorphism panel styling */
        .glass-panel {
            background: rgba(18, 26, 43, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8 relative overflow-x-hidden">

                    <!-- Quick Drop / Overlay for Photo Upload -->

                <!-- EDITABLE CURSIVE SCRIPT CAPTION -->

                    <button id="btn-next" class="text-white/80 hover:text-white transition-all transform active:scale-90 text-lg hover:scale-110" title="Next / Forward">

                <div class="flex items-center justify-center text-white/80 my-2 select-none">
                    <svg class="w-full max-w-[280px] h-6" viewBox="0 0 320 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <line x1="10" y1="12" x2="130" y2="12" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>

                            <circle cx="37" cy="10" r="1.5"/>

        <!-- CUSTOMIZATION CONTROL PANEL -->
        <div class="w-full max-w-[420px] glass-panel rounded-3xl p-6 shadow-2xl space-y-5 text-xs">
            
            <div class="flex items-center justify-between pb-3 border-b border-white/10">

                    <button class="theme-btn h-8 rounded-lg bg-[#153e5e] border-2 border-transparent transition-transform hover:scale-105" data-color="#153e5e" data-glow="rgba(30,58,138,0.2)" title="Navy Dusk"></button>
                    <button class="theme-btn h-8 rounded-lg bg-[#1b2a4a] border-2 border-transparent transition-transform hover:scale-105" data-color="#1b2a4a" data-glow="rgba(99,102,241,0.2)" title="Midnight Slate"></button>
                    <button class="theme-btn h-8 rounded-lg bg-[#3b1c32] border-2 border-transparent transition-transform hover:scale-105" data-color="#3b1c32" data-glow="rgba(236,72,153,0.2)" title="Velvet Plum"></button>

            <!-- 2. Font Style Dropdown -->
            <div class="space-y-1.5">
                <label for="font-select" class="text-gray-300 font-medium block">Cursive Script Font</label>

                        <span>Copy Code</span>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 bg-blue-600 text-white px-4 py-3 rounded-2xl shadow-2xl text-xs font-medium translate-y-20 opacity-0 transition-all duration-300 flex items-center space-x-2.5 z-50">
        <i class="fa-solid fa-circle-check text-base"></i>
        <span id="toast-message">Notification message</span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Player state variables
            let isPlaying = false;
            let audioCtx = null;
            let gainNode = null;
            let audioDuration = 30; // seconds for synthesized audio
            let currentTime = 0;
            let timerInterval = null;
            let customAudio = null;

            // DOM Elements
            const btnPlay = document.getElementById('btn-play');
            const playIcon = document.getElementById('play-icon');
            const waveContainer = document.getElementById('wave-container');
            const progressBar = document.getElementById('progress-bar');
            const currentTimeEl = document.getElementById('current-time');
            const totalDurationEl = document.getElementById('total-duration');
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            const cardQuote = document.getElementById('card-quote');
            const textCaptionInput = document.getElementById('text-caption-input');
            const musicCard = document.getElementById('music-card');
            const filigreeDot = document.getElementById('filigree-dot');
            const filigreeDot2 = document.getElementById('filigree-dot-2');
            const bgGlow = document.getElementById('bg-glow');

            // Format seconds to standard mm:ss
            function formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }

            // Web Audio API Synthesizer (Generates smooth ambient melody loop when no custom audio uploaded)
            function startSynthesizedAudio() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                gainNode = audioCtx.createGain();
