<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Profile Music Card</title>
  <!-- Google Fonts: Sacramento for handwritten cursive -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d1117;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    /* GitHub Profile Card Container */
    .github-card-container {
      width: 100%;
      max-width: 440px;
      background-color: #21517a;
      border-radius: 8px;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    /* Top Ornamental Line Header */
    .ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 22px;
    }

    .ornament .line {
      height: 1px;
      background-color: rgba(255, 255, 255, 0.4);
      flex: 1;
    }

    .ornament svg {
      width: 48px;
      height: 12px;
      fill: currentColor;
    }

    /* Center Image Frame */
    .image-frame {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      margin-bottom: 22px;
      background-color: #1a3c5b;
      border-radius: 4px;
    }

    .image-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Handwritten Cursive Quote */
    .quote-text {
      font-family: 'Sacramento', cursive;
      color: #ffffff;
      font-size: 2.3rem;
      text-align: center;
      line-height: 1.1;
      margin-bottom: 18px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    /* Soundwave Visualizer Bars */
    .soundwave {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 24px;
      margin-bottom: 18px;
    }

    .bar {
      width: 3px;
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 3px;
      height: 6px;
      transition: height 0.15s ease;
    }

    .soundwave.playing .bar {
      animation: wave 1.2s infinite ease-in-out;
    }

    .soundwave.playing .bar:nth-child(1)  { animation-delay: 0.0s; }
    .soundwave.playing .bar:nth-child(2)  { animation-delay: 0.2s; }
    .soundwave.playing .bar:nth-child(3)  { animation-delay: 0.4s; }
    .soundwave.playing .bar:nth-child(4)  { animation-delay: 0.1s; }
    .soundwave.playing .bar:nth-child(5)  { animation-delay: 0.3s; }
    .soundwave.playing .bar:nth-child(6)  { animation-delay: 0.5s; }
    .soundwave.playing .bar:nth-child(7)  { animation-delay: 0.2s; }
    .soundwave.playing .bar:nth-child(8)  { animation-delay: 0.4s; }
    .soundwave.playing .bar:nth-child(9)  { animation-delay: 0.1s; }
    .soundwave.playing .bar:nth-child(10) { animation-delay: 0.3s; }
    .soundwave.playing .bar:nth-child(11) { animation-delay: 0.0s; }
    .soundwave.playing .bar:nth-child(12) { animation-delay: 0.2s; }
    .soundwave.playing .bar:nth-child(13) { animation-delay: 0.5s; }
    .soundwave.playing .bar:nth-child(14) { animation-delay: 0.3s; }
    .soundwave.playing .bar:nth-child(15) { animation-delay: 0.1s; }

    @keyframes wave {
      0%, 100% { height: 4px; }
      50% { height: 22px; }
    }

    /* Progress Track Slider */
    .progress-container {
      width: 75%;
      display: flex;
      align-items: center;
      margin-bottom: 22px;
      cursor: pointer;
      padding: 6px 0;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
      position: relative;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #ffffff;
      border-radius: 2px;
      position: relative;
    }

    .progress-handle {
      width: 12px;
      height: 12px;
      background: #ffffff;
      border-radius: 50%;
      position: absolute;
      right: -6px;
      top: -4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    /* Control Buttons */
    .player-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
    }

    .control-btn {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }

    .control-btn:hover {
      opacity: 0.85;
    }

    .control-btn:active {
      transform: scale(0.92);
    }

    .play-pause-btn {
      width: 46px;
      height: 46px;
      background-color: #ffffff;
      border-radius: 50%;
      color: #21517a;
      box-shadow: 0 3px 10px rgba(0,0,0,0.25);
    }

    .skip-btn svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
    }

    .play-pause-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Audio Status Notice */
    .status-notice {
      position: absolute;
      bottom: 8px;
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.7);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="github-card-container">
    
    <!-- Top Ornament Decorative Line -->
    <div class="ornament">
      <div class="line"></div>
      <svg viewBox="0 0 100 20">
        <path d="M 0 10 L 35 10 Q 42 10 45 4 L 50 12 L 55 4 Q 58 10 65 10 L 100 10" stroke="currentColor" stroke-width="2" fill="none" />
        <circle cx="50" cy="12" r="3" fill="currentColor" />
      </svg>
      <div class="line"></div>
    </div>

    <!-- Album / Photo Cover -->
    <div class="image-frame">
      <img src="cover.png" alt="Cover Photo" id="cover-image" onerror="this.src='https://picsum.photos/400/400?grayscale'" />
    </div>

    <!-- Quote -->
    <div class="quote-text">Sa'yo parin ako uuwi.</div>

    <!-- Soundwave Animation -->
    <div class="soundwave" id="soundwave">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

    <!-- Progress Bar Slider -->
    <div class="progress-container" id="progress-container">
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill">
          <div class="progress-handle"></div>
        </div>
      </div>
    </div>

    <!-- Media Controls -->
    <div class="player-controls">
      <button class="control-btn skip-btn" id="prev-btn" aria-label="Previous">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>

      <button class="control-btn play-pause-btn" id="play-btn" aria-label="Play">
        <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pause-icon" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>

      <button class="control-btn skip-btn" id="next-btn" aria-label="Next">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>

    <div class="status-notice" id="status-notice"></div>

    <!-- Native Audio Object -->
    <audio id="audio-player" src="track.mp3" preload="metadata"></audio>
  </div>

  <script>
    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const pauseIcon = document.getElementById('pause-icon');
    const soundwave = document.getElementById('soundwave');
    const progressContainer = document.getElementById('progress-container');
    const progressFill = document.getElementById('progress-fill');
    const statusNotice = document.getElementById('status-notice');

    let audioContext = null;
    let synthInterval = null;
    let useFallbackSynth = false;

    // Check if local file exists or fails
    audio.addEventListener('error', () => {
      useFallbackSynth = true;
      statusNotice.innerText = "Local track.mp3 not found. Playing fallback melody.";
    });

    // Web Audio API Fallback Synth Melody Generator
    function startFallbackSynth() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }

      const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
      let noteIdx = 0;

      synthInterval = setInterval(() => {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(notes[noteIdx % notes.length], audioContext.currentTime);
        
        gain.gain.setValueAtTime(0.08, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.8);

        osc.connect(gain);
        gain.connect(audioContext.destination);

        osc.start();
        osc.stop(audioContext.currentTime + 0.8);

        noteIdx++;
      }, 400);

      updatePlayerUI(true);
    }

    function stopFallbackSynth() {
      if (synthInterval) clearInterval(synthInterval);
      updatePlayerUI(false);
    }

    // Main Toggle Handler
    function togglePlay() {
      if (useFallbackSynth) {
        if (soundwave.classList.contains('playing')) {
          stopFallbackSynth();
        } else {
          startFallbackSynth();
        }
        return;
      }

      if (audio.paused) {
        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            updatePlayerUI(true);
            statusNotice.innerText = "";
          }).catch(err => {
            console.warn('Local playback blocked, switching to synth:', err);
            useFallbackSynth = true;
            startFallbackSynth();
          });
        }
      } else {
        audio.pause();
        updatePlayerUI(false);
      }
    }

    function updatePlayerUI(isPlaying) {
      if (isPlaying) {
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
        soundwave.classList.add('playing');
      } else {
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
        soundwave.classList.remove('playing');
      }
    }

    // Time progress handling
    audio.addEventListener('timeupdate', () => {
      if (audio.duration && !useFallbackSynth) {
        const percent = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = `${percent}%`;
      }
    });

    audio.addEventListener('ended', () => {
      updatePlayerUI(false);
      progressFill.style.width = '0%';
    });

    // Manual Progress Seek
    progressContainer.addEventListener('click', (e) => {
      if (useFallbackSynth) return;
      const rect = progressContainer.getBoundingClientRect();
      const clickPosition = (e.clientX - rect.left) / rect.width;
      if (audio.duration) {
        audio.currentTime = clickPosition * audio.duration;
      }
    });

    playBtn.addEventListener('click', togglePlay);
  </script>
</body>
</html>
