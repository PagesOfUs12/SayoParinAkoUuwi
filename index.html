
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sa'yo Parin Ako Uuwi</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for Cursive Script & Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #1a4261;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .font-script {
            font-family: 'Dancing Script', 'Great Vibes', cursive;
        }

        /* Waveform bar base styling */
        .wave-bar {
            background-color: #ffffff;
            border-radius: 9999px;
            transition: height 0.2s ease;
        }

        /* Waveform pulse animation during playback */
        @keyframes soundwave {
            0%, 100% { height: 6px; }
            50% { height: 32px; }
        }

        .playing .wave-bar {
            animation: soundwave 1.1s ease-in-out infinite;
        }

        /* Staggered animation timings for organic wave motion */
        .playing .wave-bar:nth-child(1)  { animation-delay: 0.1s; }
        .playing .wave-bar:nth-child(2)  { animation-delay: 0.3s; }
        .playing .wave-bar:nth-child(3)  { animation-delay: 0.15s; }
        .playing .wave-bar:nth-child(4)  { animation-delay: 0.5s; }
        .playing .wave-bar:nth-child(5)  { animation-delay: 0.25s; }
        .playing .wave-bar:nth-child(6)  { animation-delay: 0.7s; }
        .playing .wave-bar:nth-child(7)  { animation-delay: 0.35s; }
        .playing .wave-bar:nth-child(8)  { animation-delay: 0.8s; }
        .playing .wave-bar:nth-child(9)  { animation-delay: 0.2s; }
        .playing .wave-bar:nth-child(10) { animation-delay: 0.6s; }
        .playing .wave-bar:nth-child(11) { animation-delay: 0.4s; }
        .playing .wave-bar:nth-child(12) { animation-delay: 0.75s; }
        .playing .wave-bar:nth-child(13) { animation-delay: 0.18s; }
        .playing .wave-bar:nth-child(14) { animation-delay: 0.55s; }
        .playing .wave-bar:nth-child(15) { animation-delay: 0.32s; }
        .playing .wave-bar:nth-child(16) { animation-delay: 0.85s; }
        .playing .wave-bar:nth-child(17) { animation-delay: 0.22s; }
        .playing .wave-bar:nth-child(18) { animation-delay: 0.65s; }
        .playing .wave-bar:nth-child(19) { animation-delay: 0.45s; }
        .playing .wave-bar:nth-child(20) { animation-delay: 0.12s; }

        /* Custom progress slider */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.4);
            height: 2px;
            border-radius: 2px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body class="p-4 sm:p-6">

    <!-- MAIN CARD CONTAINER -->
    <div class="w-full max-w-[440px] bg-[#225881] text-white rounded-xl p-8 sm:p-10 shadow-2xl flex flex-col items-center justify-between min-h-[660px] select-none">

        <!-- TOP ORNAMENTAL FILIGREE DIVIDER -->
        <div class="w-full flex items-center justify-center my-2 opacity-90">
            <svg class="w-full max-w-[320px] h-6" viewBox="0 0 320 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <line x1="10" y1="12" x2="130" y2="12" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
                <line x1="190" y1="12" x2="310" y2="12" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
                <g transform="translate(144, 2)" fill="white">
                    <path d="M12 10C8 5 3 4 0 10C3 16 8 15 12 10Z"/>
                    <circle cx="-5" cy="10" r="1.5"/>
                    <path d="M20 10C24 5 29 4 32 10C29 16 24 15 20 10Z"/>
                    <circle cx="37" cy="10" r="1.5"/>
                    <polygon points="16,4 21,10 16,16 11,10"/>
                    <circle cx="16" cy="10" r="1.5" fill="#225881"/>
                </g>
            </svg>
        </div>

        <!-- PHOTO DISPLAY -->
        <div class="w-full aspect-square my-6 overflow-hidden rounded-sm shadow-xl bg-slate-900/40">
            <img id="card-photo" 
                 src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=800&q=80" 
                 class="w-full h-full object-cover" 
                 alt="Aquarium Couple Photo">
        </div>

        <!-- HANDWRITTEN CURSIVE TEXT -->
        <div class="my-2 text-center">
            <h1 class="font-script text-4xl sm:text-5xl tracking-wide font-normal drop-shadow-md text-white">
                Sa'yo parin ako uuwi.
            </h1>
        </div>

        <!-- SOUNDWAVE VISUALIZER -->
        <div id="waveform" class="flex items-center justify-center space-x-[3px] h-8 my-3 w-full max-w-[280px]">
            <div class="wave-bar w-[2px] h-1"></div>
            <div class="wave-bar w-[2px] h-2"></div>
            <div class="wave-bar w-[2px] h-3"></div>
            <div class="wave-bar w-[2px] h-5"></div>
            <div class="wave-bar w-[2px] h-7"></div>
            <div class="wave-bar w-[2px] h-4"></div>
            <div class="wave-bar w-[2px] h-6"></div>
            <div class="wave-bar w-[2px] h-8"></div>
            <div class="wave-bar w-[2px] h-5"></div>
            <div class="wave-bar w-[2px] h-7"></div>
            <div class="wave-bar w-[2px] h-[30px]"></div>
            <div class="wave-bar w-[2px] h-6"></div>
            <div class="wave-bar w-[2px] h-8"></div>
            <div class="wave-bar w-[2px] h-4"></div>
            <div class="wave-bar w-[2px] h-6"></div>
            <div class="wave-bar w-[2px] h-5"></div>
            <div class="wave-bar w-[2px] h-3"></div>
            <div class="wave-bar w-[2px] h-2"></div>
            <div class="wave-bar w-[2px] h-1"></div>
            <div class="wave-bar w-[2px] h-1"></div>
        </div>

        <!-- AUDIO PROGRESS SCRUBBER -->
        <div class="w-full max-w-[280px] my-2">
            <input type="range" id="progress-bar" value="0" min="0" max="100" class="w-full cursor-pointer">
        </div>

        <!-- PLAYER BUTTON CONTROLS -->
        <div class="flex items-center justify-center space-x-8 text-white my-3">
            <button id="btn-prev" class="hover:opacity-80 transition-opacity active:scale-90 text-xl" title="Previous">
                <i class="fa-solid fa-backward-step"></i>
            </button>

            <button id="btn-play" class="w-12 h-12 rounded-full bg-white text-[#225881] flex items-center justify-center text-xl shadow-md hover:scale-105 active:scale-95 transition-transform" title="Play / Pause">
                <i class="fa-solid fa-play ml-0.5" id="play-icon"></i>
            </button>

            <button id="btn-next" class="hover:opacity-80 transition-opacity active:scale-90 text-xl" title="Next">
                <i class="fa-solid fa-forward-step"></i>
            </button>
        </div>

        <!-- BOTTOM ORNAMENTAL FILIGREE DIVIDER -->
        <div class="w-full flex items-center justify-center my-2 opacity-90">
            <svg class="w-full max-w-[320px] h-6" viewBox="0 0 320 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <line x1="10" y1="12" x2="130" y2="12" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
                <line x1="190" y1="12" x2="310" y2="12" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
                <g transform="translate(144, 2)" fill="white">
                    <path d="M12 10C8 5 3 4 0 10C3 16 8 15 12 10Z"/>
                    <circle cx="-5" cy="10" r="1.5"/>
                    <path d="M20 10C24 5 29 4 32 10C29 16 24 15 20 10Z"/>
                    <circle cx="37" cy="10" r="1.5"/>
                    <polygon points="16,4 21,10 16,16 11,10"/>
                    <circle cx="16" cy="10" r="1.5" fill="#225881"/>
                </g>
            </svg>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let isPlaying = false;
            let audioCtx = null;
            let gainNode = null;
            let progress = 0;
            let interval = null;
            const trackDuration = 180; // 3 minutes total track duration

            const btnPlay = document.getElementById('btn-play');
            const playIcon = document.getElementById('play-icon');
            const waveform = document.getElementById('waveform');
            const progressBar = document.getElementById('progress-bar');
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');

            // Web Audio API melody loop synthesizer for realistic audio feedback
            function startAudioMelody() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0.04, audioCtx.currentTime);

                // Warm ambient chord notes
                const notes = [261.63, 329.63, 392.00, 523.25]; // C major triad chord harmonics
                notes.forEach(freq => {
                    const osc = audioCtx.createOscillator();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    osc.connect(gainNode);
                    osc.start();
                });

                gainNode.connect(audioCtx.destination);
            }

            function stopAudioMelody() {
                if (gainNode && audioCtx) {
                    gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
                    setTimeout(() => {
                        try { gainNode.disconnect(); } catch(e) {}
                    }, 150);
                }
            }

            function togglePlay() {
                if (isPlaying) {
                    stopAudioMelody();
                    clearInterval(interval);
                    playIcon.classList.remove('fa-pause');
                    playIcon.classList.add('fa-play', 'ml-0.5');
                    waveform.classList.remove('playing');
                } else {
                    startAudioMelody();
                    interval = setInterval(() => {
                        progress += (100 / trackDuration);
                        if (progress >= 100) {
                            progress = 0;
                            togglePlay();
                        }
                        progressBar.value = progress;
                    }, 1000);

                    playIcon.classList.remove('fa-play', 'ml-0.5');
                    playIcon.classList.add('fa-pause');
                    waveform.classList.add('playing');
                }
                isPlaying = !isPlaying;
            }

            btnPlay.addEventListener('click', togglePlay);

            progressBar.addEventListener('input', (e) => {
                progress = parseFloat(e.target.value);
            });

            btnPrev.addEventListener('click', () => {
                progress = Math.max(0, progress - 10);
                progressBar.value = progress;
            });

            btnNext.addEventListener('click', () => {
                progress = Math.min(100, progress + 10);
                progressBar.value = progress;
            });
        });
    </script>
</body>
</html>
